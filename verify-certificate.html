<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify NIPS Certificate</title><meta name="description" content="Verify a certificate issued by NIPS Education Solutions."><link rel="stylesheet" href="css/style.css?v=5"><style>.verify-wrap{max-width:760px;margin:80px auto;padding:20px}.verify-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.08)}.verify-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:20px 0}.verify-grid div{background:#f5f7f6;border-radius:10px;padding:13px}.verify-grid span,.verify-grid strong{display:block}.verify-grid span{font-size:12px;color:#6b7280;text-transform:uppercase}.valid{color:#166534}.invalid{color:#991b1b}@media(max-width:600px){.verify-grid{grid-template-columns:1fr}}</style></head><body><main class="verify-wrap"><div class="verify-card"><a href="/">← NIPS website</a><h1 style="margin-top:18px">Certificate verification</h1><p id="status">Checking the NIPS certificate record…</p><div id="result"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const client=supabase.createClient("https://qajupsfbmbmbrjlqpstx.supabase.co","sb_publishable_qPM05rVcSDylY3K_viaksw_D-31dW90");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{const code=new URLSearchParams(location.search).get("code")||"";const status=document.getElementById("status"),result=document.getElementById("result");if(!code){status.className="invalid";status.textContent="Enter a valid certificate verification link.";return}const{data,error}=await client.rpc("verify_certificate",{p_code:code});const row=data?.[0];if(error||!row){status.className="invalid";status.textContent="No certificate was found for this verification code.";return}status.className=row.is_valid?"valid":"invalid";status.innerHTML=row.is_valid?"✓ This certificate is authentic and currently valid.":"This certificate has been revoked.";result.innerHTML=`<div class="verify-grid"><div><span>Certificate</span><strong>${esc(row.certificate_number)}</strong></div><div><span>Student</span><strong>${esc(row.student_name)}</strong></div><div><span>Father / guardian</span><strong>${esc(row.father_name)}</strong></div><div><span>Institution</span><strong>${esc(row.institution)}</strong></div><div><span>Program</span><strong>${esc(row.program)}</strong></div><div><span>Course</span><strong>${esc(row.course)}</strong></div><div><span>Duration</span><strong>${esc(row.duration)}</strong></div><div><span>Completion date</span><strong>${new Date(row.completion_date+"T00:00:00Z").toLocaleDateString("en-GB",{dateStyle:"long",timeZone:"UTC"})}</strong></div><div><span>Authorized by</span><strong>${esc(row.signer_name)}, ${esc(row.signer_title)}</strong></div></div><a class="btn btn-primary" href="https://qajupsfbmbmbrjlqpstx.supabase.co/functions/v1/certificate-pdf?code=${encodeURIComponent(code)}" target="_blank" rel="noopener">View certificate PDF</a>`})();
</script></body></html>
