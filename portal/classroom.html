<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>NIPS Portal — Classroom</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="portal.css?v=16" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1a5336" />
  <link rel="apple-touch-icon" href="../assets/nips-logo.png" />
  <style>
    #jitsi{height:calc(100vh - 58px);width:100%}
    .cbar{background:var(--primary);color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between}
    .cbar .info{font-family:'Outfit',sans-serif;font-weight:600}
  </style>
</head>
<body data-portal-footer="false">
  <div class="cbar">
    <div class="info" id="title">Loading class…</div>
    <div><a class="btn ghost sm" id="back">← Leave</a></div>
  </div>
  <div id="jitsi"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://8x8.vc/external_api.js"></script>
  <script src="config.js?v=10"></script>
  <script>
    (async () => {
      const session = await requireAuth();
      const profile = await getProfile();
      const params = new URLSearchParams(location.search);
      const batchId = params.get("batch");
      if (!batchId) { alert("No batch specified."); history.back(); return; }

      const isTeacher = profile.role === "teacher" || profile.role === "admin";
      document.getElementById("back").href = isTeacher ? "teacher.html" : "student.html";
      if (profile.role === "admin") document.getElementById("back").href = "admin.html";

      // Ask the Edge Function for a JaaS token. It re-checks access server-side
      // and decides moderator (teacher/admin) vs guest (paid student).
      let tok;
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/jaas-token?batch=${batchId}`, {
          headers: { Authorization: `Bearer ${session.access_token}` }
        });
        tok = await res.json();
        if (!res.ok) throw new Error(tok.error || "Could not join");
      } catch (e) {
        alert("Unable to join this class: " + e.message);
        location.href = document.getElementById("back").href;
        return;
      }

      document.getElementById("title").textContent = tok.room;

      // A session starts only after the moderator actually joins. A heartbeat
      // makes mobile/tab closures self-expiring even when pagehide never fires.
      let sessionId = null;
      let heartbeatTimer = null;
      const patchSession = (payload, keepalive = false) => {
        if (!sessionId) return Promise.resolve();
        return fetch(`${SUPABASE_URL}/rest/v1/sessions?id=eq.${encodeURIComponent(sessionId)}`, {
          method: "PATCH", keepalive,
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${session.access_token}`, "Content-Type": "application/json", Prefer: "return=minimal" },
          body: JSON.stringify(payload)
        }).catch(() => {});
      };
      const startSession = async () => {
        if (!isTeacher || sessionId) return;
        await sb.from("sessions").update({ ended_at: new Date().toISOString() })
          .eq("batch_id", batchId).eq("created_by", profile.id).is("ended_at", null);
        const now = new Date().toISOString();
        const { data } = await sb.from("sessions")
          .insert({ batch_id: batchId, title: tok.room, created_by: profile.id, last_heartbeat_at: now }).select().single();
        sessionId = data?.id || null;
        if (sessionId) heartbeatTimer = setInterval(() => patchSession({ last_heartbeat_at: new Date().toISOString() }), 20000);
      };
      const endSession = () => {
        if (heartbeatTimer) clearInterval(heartbeatTimer);
        heartbeatTimer = null;
        if (sessionId) { patchSession({ ended_at: new Date().toISOString(), last_heartbeat_at: new Date().toISOString() }, true); sessionId = null; }
      };
      if (isTeacher) window.addEventListener("pagehide", endSession);

      const api = new JitsiMeetExternalAPI("8x8.vc", {
        roomName: `${tok.appId}/${tok.room}`,
        jwt: tok.jwt,
        parentNode: document.getElementById("jitsi"),
        userInfo: { displayName: tok.name || profile.full_name },
        configOverwrite: {
          startWithAudioMuted: !tok.moderator,
          prejoinPageEnabled: false,
          disableChat: true,
          hideDisplayName: true,
          disableParticipantMenu: true,
          filmstrip: { disableResizable: true },
          toolbarButtons: tok.moderator
            ? ['microphone','camera','desktop','whiteboard','raisehand','tileview','recording','hangup','settings']
            : ['microphone','camera','whiteboard','raisehand','tileview','hangup'],
          whiteboard: { enabled: true }
        },
        interfaceConfigOverwrite: {
          HIDE_DISPLAY_NAME: true,
          TOOLBAR_BUTTONS: tok.moderator
            ? ['microphone','camera','desktop','whiteboard','raisehand','tileview','recording','hangup','settings']
            : ['microphone','camera','whiteboard','raisehand','tileview','hangup']
        }
      });

      api.addEventListener("videoConferenceJoined", startSession);
      api.addEventListener("videoConferenceLeft", endSession);
      api.addEventListener("readyToClose", () => { endSession(); location.href = document.getElementById("back").href; });
    })();
  </script>
</body>
</html>
