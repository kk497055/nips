<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>NIPS Portal — Classroom</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="portal.css?v=16" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1a5336" />
  <link rel="apple-touch-icon" href="../assets/nips-logo-transparent-v2.png" />
  <style>
    #jitsi{height:calc(100vh - 58px);width:100%}
    .cbar{background:var(--primary);color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between}
    .cbar .info{font-family:'Outfit',sans-serif;font-weight:600}
    #switch-camera{display:none}
    #open-board{display:none}
    #open-board.available{display:inline-flex}
    .nips-board{position:fixed;inset:58px 0 0;z-index:30;background:#eef2ef;display:flex;flex-direction:column}
    .nips-board[hidden]{display:none!important}
    .nips-board-bar{min-height:54px;padding:8px 12px;background:#fff;border-bottom:1px solid #d8dedb;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .nips-board-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .nips-board-tools input[type="color"]{width:42px;height:36px;padding:2px;border:1px solid #cbd5d1;border-radius:8px;background:#fff}
    .nips-board-canvas-wrap{position:relative;flex:1;min-height:0;padding:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    #nips-board-canvas{width:100%;height:100%;background:#fff;border:1px solid #d8dedb;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08);touch-action:none}
    @media (max-width:900px), (pointer:coarse){
      .cbar{gap:10px;padding:9px 12px}
      .cbar>div:last-child{display:flex;align-items:center;gap:8px}
      #switch-camera.available{display:inline-flex}
    }
  </style>
</head>
<body data-portal-footer="false">
  <div class="cbar">
    <div class="info" id="title">Loading class…</div>
    <div><button class="btn ghost sm" id="open-board" type="button">Whiteboard</button><button class="btn ghost sm" id="switch-camera" type="button" aria-label="Switch between front and rear camera">Switch camera</button><a class="btn ghost sm" id="back">← Leave</a></div>
  </div>
  <div id="jitsi"></div>
  <section class="nips-board" id="nips-board" hidden aria-label="NIPS classroom whiteboard">
    <div class="nips-board-bar">
      <div><strong>NIPS Whiteboard</strong><div class="meta" id="nips-board-status">Teacher controlled · read-only for students</div></div>
      <div class="nips-board-tools" id="nips-board-tools"></div>
    </div>
    <div class="nips-board-canvas-wrap"><canvas id="nips-board-canvas"></canvas></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://8x8.vc/external_api.js"></script>
  <script src="config.js?v=10"></script>
  <script src="classroom-whiteboard.js?v=3"></script>
  <script>
    (async () => {
      const session = await requireAuth();
      const profile = await getProfile();
      const params = new URLSearchParams(location.search);
      const batchId = params.get("batch");
      if (!batchId) { alert("No batch specified."); history.back(); return; }

      const isTeacher = profile.role === "teacher" || profile.role === "admin";
      document.getElementById("back").href = isTeacher ? "teacher.html" : "student.html";
      if (profile.role === "admin") document.getElementById("back").href = "admin.html";

      // Ask the Edge Function for a JaaS token. It re-checks access server-side
      // and decides moderator (teacher/admin) vs guest (paid student).
      let tok;
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/jaas-token?batch=${batchId}`, {
          headers: { Authorization: `Bearer ${session.access_token}` }
        });
        tok = await res.json();
        if (!res.ok) throw new Error(tok.error || "Could not join");
      } catch (e) {
        alert("Unable to join this class: " + e.message);
        location.href = document.getElementById("back").href;
        return;
      }

      document.getElementById("title").textContent = tok.room;

      // A session starts only after the moderator actually joins. A heartbeat
      // makes mobile/tab closures self-expiring even when pagehide never fires.
      let sessionId = null;
      let heartbeatTimer = null;
      let absoluteEndTimer = null;
      const patchSession = (payload, keepalive = false) => {
        if (!sessionId) return Promise.resolve();
        return fetch(`${SUPABASE_URL}/rest/v1/sessions?id=eq.${encodeURIComponent(sessionId)}`, {
          method: "PATCH", keepalive,
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${session.access_token}`, "Content-Type": "application/json", Prefer: "return=minimal" },
          body: JSON.stringify(payload)
        }).catch(() => {});
      };
      const startSession = async () => {
        if (!isTeacher || sessionId) return;
        await sb.from("sessions").update({ ended_at: new Date().toISOString() })
          .eq("batch_id", batchId).eq("created_by", profile.id).is("ended_at", null);
        const now = new Date().toISOString();
        const { data: batchTiming } = await sb.from("batches").select("class_duration_minutes").eq("id", batchId).single();
        const durationMinutes = Math.min(480, Math.max(15, Number(batchTiming?.class_duration_minutes || 60)));
        const scheduledEndAt = new Date(Date.now() + durationMinutes * 60000).toISOString();
        const { data } = await sb.from("sessions")
          .insert({ batch_id: batchId, title: tok.room, created_by: profile.id, last_heartbeat_at: now, scheduled_end_at: scheduledEndAt }).select().single();
        sessionId = data?.id || null;
        if (sessionId) {
          heartbeatTimer = setInterval(() => patchSession({ last_heartbeat_at: new Date().toISOString() }), 20000);
          absoluteEndTimer = setTimeout(endSession, durationMinutes * 60000);
        }
      };
      const endSession = () => {
        if (heartbeatTimer) clearInterval(heartbeatTimer);
        if (absoluteEndTimer) clearTimeout(absoluteEndTimer);
        heartbeatTimer = null;
        absoluteEndTimer = null;
        if (sessionId) { patchSession({ ended_at: new Date().toISOString(), last_heartbeat_at: new Date().toISOString() }, true); sessionId = null; }
      };
      if (isTeacher) window.addEventListener("pagehide", endSession);

      const api = new JitsiMeetExternalAPI("8x8.vc", {
        roomName: `${tok.appId}/${tok.room}`,
        jwt: tok.jwt,
        parentNode: document.getElementById("jitsi"),
        userInfo: { displayName: tok.name || profile.full_name },
        configOverwrite: {
          startWithAudioMuted: !tok.moderator,
          prejoinPageEnabled: false,
          resolution: 720,
          constraints: { video: { height: { ideal: 720, max: 720, min: 360 } } },
          maxFullResolutionParticipants: 1,
          channelLastN: tok.moderator ? -1 : 1,
          startLastN: tok.moderator ? -1 : 1,
          disableChat: false,
          // Keep the shared classroom chat available while preventing direct
          // participant-to-participant messages.
          remoteVideoMenu: { disabled: true, disablePrivateChat: 'all' },
          hideDisplayName: true,
          disableParticipantMenu: true,
          // Batch classrooms are stage-only on every device. Teachers open the
          // participants panel when they need the roster; persistent avatar
          // cards otherwise steal space from video, screen share and whiteboard.
          filmstrip: { disabled: true, disableResizable: true },
          disableSelfView: true,
          toolbarButtons: tok.moderator
            ? ['microphone','camera','desktop','chat','participants-pane','raisehand','recording','hangup','settings']
            : ['microphone','camera','chat','raisehand','hangup'],
          whiteboard: { enabled: false }
        },
        interfaceConfigOverwrite: {
          HIDE_DISPLAY_NAME: true,
          // Jitsi's default vertical filmstrip reserves about 200px on the
          // right even when its tiles are hidden. A zero-height horizontal
          // strip releases the full stage for whiteboards and shared notes.
          VERTICAL_FILMSTRIP: false,
          FILM_STRIP_MAX_HEIGHT: 0,
          VIDEO_LAYOUT_FIT: 'nocrop',
          TOOLBAR_BUTTONS: tok.moderator
            ? ['microphone','camera','desktop','chat','participants-pane','raisehand','recording','hangup','settings']
            : ['microphone','camera','chat','raisehand','hangup']
        }
      });

      const switchCamera = document.getElementById("switch-camera");
      // Jitsi moderator privileges are shared by teachers and administrators,
      // but the assigned teaching role owns the classroom whiteboard. Admins
      // retain call moderation while observing the teacher's shared board.
      const board = createNipsWhiteboard(api, { isTeacher: profile.role === "teacher" });
      const enforceStageOnly = ({ visible } = {}) => {
        api.executeCommand("setTileView", false);
        // Some hosted Jitsi releases ignore filmstrip.disabled on mobile.
        // Close it when Jitsi reports it visible and prevent students from
        // reopening tile view through the toolbar.
        if (visible === true) api.executeCommand("toggleFilmStrip");
      };
      switchCamera.addEventListener("click", () => {
        // Jitsi's mobile-web command alternates between user-facing and
        // environment-facing cameras without exposing the full settings UI.
        api.executeCommand("toggleCamera");
      });
      api.addEventListener("videoConferenceJoined", event => {
        switchCamera.classList.add("available");
        api.executeCommand("setVideoQuality", 720);
        board.onJoined(event);
        enforceStageOnly();
        startSession();
      });
      api.addEventListener("filmstripDisplayChanged", enforceStageOnly);
      api.addEventListener("videoConferenceLeft", endSession);
      api.addEventListener("readyToClose", () => { endSession(); location.href = document.getElementById("back").href; });
    })();
  </script>
</body>
</html>
