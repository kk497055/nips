<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>NIPS Faculty Interview</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="portal.css?v=17.1"><style>
body{margin:0;background:#f5f7f6}.interview-head{min-height:58px;background:var(--primary);color:#fff;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.interview-head img{width:38px;height:38px;object-fit:contain}.interview-brand{display:flex;align-items:center;gap:10px;font-family:'Outfit',sans-serif;font-weight:700}.interview-controls{display:flex;align-items:center;gap:9px}.interview-status{font-size:13px}.interview-wait{max-width:620px;margin:8vh auto;padding:16px}.interview-wait .card{text-align:center;padding:30px}.interview-wait h1{font-size:26px}.interview-wait .btn{margin-top:10px}#jitsi{height:calc(100vh - 58px);width:100%}#interview-share-screen{display:none}#interview-share-screen.available{display:inline-flex}
</style></head><body data-portal-footer="false"><header class="interview-head"><div class="interview-brand"><img src="../assets/nips-logo-transparent-v2.png" alt="NIPS"><span>NIPS Faculty Interview</span></div><div class="interview-controls"><button class="btn ghost sm" id="interview-share-screen" type="button">Share screen</button><span class="interview-status" id="head-status">Secure Jitsi room</span></div></header><main id="waiting" class="interview-wait"><div class="card"><h1 id="title">Loading interview…</h1><p class="meta" id="details"></p><div class="msg" id="message"></div><button class="btn green" id="join" hidden>Join interview</button></div></main><div id="jitsi" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://8x8.vc/external_api.js"></script><script src="config.js?v=10"></script><script>
const params=new URLSearchParams(location.search),guestToken=params.get("token"),interviewId=params.get("interview");let current=null,api=null,isModerator=false;
const msg=(text,error=false)=>{const el=document.getElementById("message");el.className=`msg ${error?"err":""}`;el.textContent=text};
async function adminRequest(action,extra={}){const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error("Sign in as an administrator to open this interview.");const res=await fetch(`${SUPABASE_URL}/functions/v1/admin-faculty-interview`,{method:"POST",headers:{Authorization:`Bearer ${session.access_token}`,"Content-Type":"application/json"},body:JSON.stringify({action,interview_id:interviewId,...extra})});const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.error||"Interview could not be opened.");return body}
async function guestRequest(join=false){const res=await fetch(`${SUPABASE_URL}/functions/v1/faculty-interview?token=${encodeURIComponent(guestToken||"")}`,{method:join?"POST":"GET",headers:{"Content-Type":"application/json"}});const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.error||"Interview could not be opened.");return body}
function launch(tok){current=tok;document.getElementById("waiting").hidden=true;document.getElementById("jitsi").hidden=false;document.getElementById("head-status").textContent=isModerator?"Interviewer":"Faculty applicant";api=new JitsiMeetExternalAPI("8x8.vc",{roomName:`${tok.appId}/${tok.room}`,jwt:tok.jwt,parentNode:document.getElementById("jitsi"),userInfo:{displayName:tok.name},configOverwrite:{prejoinPageEnabled:false,startWithAudioMuted:false,startWithVideoMuted:false,resolution:720,constraints:{video:{height:{ideal:720,max:720,min:360}}},disableDesktopSharing:false,desktopSharingFrameRate:{min:5,max:15},disableChat:true,disableParticipantMenu:true,remoteVideoMenu:{disabled:true,disablePrivateChat:"all"},toolbarButtons:["microphone","camera","desktop","tileview","hangup","settings"]},interfaceConfigOverwrite:{HIDE_DISPLAY_NAME:false,TOOLBAR_BUTTONS:["microphone","camera","desktop","tileview","hangup","settings"]}});const iframe=api.getIFrame();if(iframe)iframe.setAttribute("allow","camera; microphone; display-capture; fullscreen; autoplay; clipboard-write");const share=document.getElementById("interview-share-screen");share.classList.add("available");api.addEventListener("screenSharingStatusChanged",({on})=>{share.textContent=on?"Stop sharing":"Share screen"});api.addEventListener("readyToClose",finish);api.addEventListener("videoConferenceLeft",finish)}
async function finish(){location.href=isModerator?"admin-faculty-applications.html":"teacher-apply.html"}
document.getElementById("join").onclick=async()=>{try{msg("Connecting securely…");const tok=isModerator?await adminRequest("join"):await guestRequest(true);launch(tok)}catch(e){msg(e.message,true)}};
document.getElementById("interview-share-screen").onclick=()=>{if(!api)return;if(!navigator.mediaDevices?.getDisplayMedia){alert("Screen sharing is not supported by this mobile browser. Please use a computer with Chrome, Edge or Safari.");return}api.executeCommand("toggleShareScreen")};
(async()=>{try{if(interviewId){isModerator=true;document.getElementById("title").textContent="Faculty interview";document.getElementById("details").textContent="Join as the NIPS interviewer. The applicant can enter after you join.";document.getElementById("join").hidden=false;return}if(!guestToken)throw new Error("This interview link is incomplete.");const info=await guestRequest(false);document.getElementById("title").textContent=`Interview for ${info.applicant_name||"faculty applicant"}`;document.getElementById("details").textContent=`${new Date(info.scheduled_at).toLocaleString("en-PK",{dateStyle:"full",timeStyle:"short",timeZone:"Asia/Karachi"})} · ${info.duration_minutes} minutes · Pakistan time`;if(!info.can_join)msg("The room opens 30 minutes before the scheduled interview.");else if(!info.interviewer_ready)msg("Your interviewer has not joined yet. You may retry in a moment.");document.getElementById("join").textContent=info.interviewer_ready?"Join interview":"Check again";document.getElementById("join").hidden=false}catch(e){document.getElementById("title").textContent="Interview unavailable";msg(e.message,true)}})();
</script></body></html>
