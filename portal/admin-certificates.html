<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>NIPS Portal - Certificates</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="portal.css?v=17"></head><body><div class="topbar"><div class="brand"><img src="../assets/nips-logo-1.png" alt="NIPS"> NIPS Portal</div><div class="right"><span id="who"></span><span class="badge">Admin</span><button class="btn ghost sm" onclick="logout()">Logout</button></div></div><main class="wrap"><a href="admin.html?view=students" class="meta">← Back to admin</a><h1 style="margin-top:8px">Certificates</h1><p class="sub">Issue completion certificates, preserve the issuance ledger, and provide QR-based public verification.</p>
<section class="section"><h2>Certificate authority</h2><div class="card"><div class="msg" id="settings-msg"></div><div class="template-form-grid"><div class="field"><label>Chief Executive name *</label><input id="signer-name"></div><div class="field"><label>Title</label><input id="signer-title" value="Chief Executive"></div><div class="field"><label>Signature image</label><input id="signature-file" type="file" accept="image/png,image/jpeg,image/webp"><div class="meta">Upload the approved signature image, maximum 2 MB.</div></div><div class="field"><label>Current signature</label><div id="signature-preview" class="meta">Not configured</div></div></div><button class="btn green" id="save-settings">Save authority settings</button></div></section>
<section class="section"><h2>Issue certificate</h2><div class="card"><div class="msg" id="issue-msg"></div><div class="template-form-grid"><div class="field"><label>Student *</label><select id="cert-student"></select></div><div class="field"><label>Batch</label><select id="cert-batch"></select></div><div class="field"><label>Institution *</label><select id="cert-institution"><option>NIPS Education Solutions</option><option>Institute of Arts & Culture</option></select></div><div class="field"><label>Program *</label><input id="cert-program" placeholder="e.g. Fine Arts Program"></div><div class="field"><label>Course *</label><input id="cert-course" placeholder="e.g. Calligraphy Fundamentals"></div><div class="field"><label>Duration *</label><input id="cert-duration" placeholder="e.g. 8 weeks / 24 hours"></div><div class="field"><label>Date of completion *</label><input id="cert-date" type="date"></div></div><button class="btn green" id="issue-certificate">Issue certificate</button></div></section>
<section class="section"><h2>Issued certificate ledger</h2><div id="certificate-ledger"><p class="empty">Loading…</p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=10"></script><script>
let students=[],batches=[],certificates=[],settings=null;const pdfUrl=code=>`${SUPABASE_URL}/functions/v1/certificate-pdf?code=${encodeURIComponent(code)}`;
(async()=>{if(!await requireAuth())return;const me=await getProfile();if(!me)return;if(me.role!=="admin")return routeByRole(me.role);window._meId=me.id;document.getElementById("who").textContent=me.full_name;document.getElementById("cert-date").value=new Date().toISOString().slice(0,10);await loadAll()})();
async function loadAll(){const[s,b,c,set]=await Promise.all([sb.from("profiles").select("id,full_name,student_code").eq("role","student").order("full_name"),sb.from("batches").select("id,name,category,schedule").order("name"),sb.from("certificates").select("*,profiles!certificates_student_id_fkey(full_name)").order("issued_at",{ascending:false}),sb.from("certificate_settings").select("*").eq("id",true).single()]);students=s.data||[];batches=b.data||[];certificates=c.data||[];settings=set.data||{};document.getElementById("cert-student").innerHTML='<option value="">— select student —</option>'+students.map(x=>`<option value="${x.id}">${esc(x.full_name)}${x.student_code?` · ${esc(x.student_code)}`:""}</option>`).join("");document.getElementById("cert-batch").innerHTML='<option value="">— no batch —</option>'+batches.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");document.getElementById("signer-name").value=settings.signer_name||"";document.getElementById("signer-title").value=settings.signer_title||"Chief Executive";document.getElementById("signature-preview").innerHTML=settings.signature_url?`<img src="${safeUrl(settings.signature_url)}" alt="Current signature" style="max-width:190px;max-height:70px">`:'Not configured';renderLedger()}
document.getElementById("cert-batch").onchange=()=>{const b=batches.find(x=>x.id===document.getElementById("cert-batch").value);if(!b)return;document.getElementById("cert-program").value=b.category||"";document.getElementById("cert-course").value=b.name||""};
document.getElementById("save-settings").onclick=async()=>{const msg=document.getElementById("settings-msg");try{let signature_url=settings.signature_url||null;const file=document.getElementById("signature-file").files[0];if(file){if(file.size>2097152)throw new Error("Signature image must be under 2 MB.");const ext=(file.name.split('.').pop()||'png').toLowerCase();const path=`signatures/chief-executive-${Date.now()}.${ext}`;const{error}=await sb.storage.from("certificate-assets").upload(path,file,{upsert:false});if(error)throw error;signature_url=sb.storage.from("certificate-assets").getPublicUrl(path).data.publicUrl}const payload={id:true,signer_name:document.getElementById("signer-name").value.trim(),signer_title:document.getElementById("signer-title").value.trim()||"Chief Executive",signature_url,updated_at:new Date().toISOString(),updated_by:window._meId};if(!payload.signer_name)throw new Error("Chief Executive name is required.");const{error}=await sb.from("certificate_settings").upsert(payload);if(error)throw error;msg.className="msg ok";msg.textContent="Certificate authority settings saved.";await loadAll()}catch(e){msg.className="msg err";msg.textContent=e.message}};
document.getElementById("issue-certificate").onclick=async()=>{const msg=document.getElementById("issue-msg"),args={p_student_id:document.getElementById("cert-student").value,p_batch_id:document.getElementById("cert-batch").value||null,p_institution:document.getElementById("cert-institution").value,p_program:document.getElementById("cert-program").value.trim(),p_course:document.getElementById("cert-course").value.trim(),p_duration:document.getElementById("cert-duration").value.trim(),p_completion_date:document.getElementById("cert-date").value};if(!args.p_student_id||!args.p_program||!args.p_course||!args.p_duration||!args.p_completion_date){msg.className="msg err";msg.textContent="Complete all required fields.";return}if(!confirm("Issue this completion certificate? The issuance will be permanently recorded."))return;const{data,error}=await sb.rpc("issue_certificate",args);if(error){msg.className="msg err";msg.textContent=error.message;return}msg.className="msg ok";msg.innerHTML=`Certificate ${esc(data.certificate_number)} issued. <a href="${pdfUrl(data.verification_code)}" target="_blank" rel="noopener">Open PDF</a>`;await loadAll()};
function renderLedger(){mountList("certificate-ledger","certificate-ledger",certificates,{pageSize:12,noun:"certificates",placeholder:"Search certificate, student, course or program…",empty:"No certificates have been issued.",match:(c,t)=>`${c.certificate_number} ${c.profiles?.full_name||""} ${c.course} ${c.program}`.toLowerCase().includes(t),render:items=>`<div class="batch-roster-wrap"><table class="batch-roster-table"><thead><tr><th>Certificate</th><th>Student</th><th>Course</th><th>Completion</th><th>Status</th><th>Actions</th></tr></thead><tbody>${items.map(c=>`<tr><td data-label="Certificate"><strong>${esc(c.certificate_number)}</strong><br><span class="meta">${new Date(c.issued_at).toLocaleDateString()}</span></td><td data-label="Student">${esc(c.profiles?.full_name||"Student")}</td><td data-label="Course">${esc(c.course)}<br><span class="meta">${esc(c.program)} · ${esc(c.duration)}</span></td><td data-label="Completion">${new Date(c.completion_date+'T00:00:00Z').toLocaleDateString('en-GB',{timeZone:'UTC'})}</td><td data-label="Status"><span class="pill ${c.revoked_at?'pending':'paid'}">${c.revoked_at?'revoked':'valid'}</span></td><td data-label="Actions"><div class="row-actions"><a class="btn green sm" href="${pdfUrl(c.verification_code)}" target="_blank" rel="noopener">PDF</a><a class="btn soft sm" href="../verify-certificate.html?code=${encodeURIComponent(c.verification_code)}" target="_blank" rel="noopener">Verify</a></div></td></tr>`).join('')}</tbody></table></div>`})}
</script></body></html>
