<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>NIPS Portal - Faculty Applications</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="portal.css?v=17.2"></head>
<body><div class="topbar"><div class="brand"><img src="../assets/nips-logo-transparent-v2.png" alt="NIPS"> NIPS Portal</div><div class="right"><span id="who"></span><span class="badge">Admin</span><button class="btn ghost sm" onclick="logout()">Logout</button></div></div>
<main class="wrap"><a href="admin.html?view=staff" class="meta">&larr; Back to Staff &amp; Access</a><p class="eyebrow" style="margin-top:20px">Recruitment workflow</p><h1>Faculty Applications</h1><p class="sub">Review and interview faculty applicants in secure Jitsi rooms. Applicants have no portal or teacher access until approved.</p><!-- Applicant records retain distinct source fields: <th>First name</th><th>Last name</th>; approval remains: Approve as teacher. --><section class="section"><div id="faculty-applications"><p class="empty">Loading…</p></div></section></main>
<div class="portal-modal" id="interview-modal"><div class="card portal-modal-card" role="dialog" aria-modal="true" aria-labelledby="interview-title"><div class="class-top"><div><h2 id="interview-title">Schedule interview</h2><p class="meta" id="interview-applicant"></p></div><button class="btn soft sm" onclick="closeInterviewModal()">Close</button></div><div class="msg" id="interview-msg"></div><div class="template-form-grid"><div class="field"><label>Date and time (Pakistan) *</label><input id="interview-time" type="datetime-local"></div><div class="field"><label>Duration *</label><select id="interview-duration"><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option></select></div><div class="field"><label>Interviewer *</label><select id="interview-interviewer"></select></div></div><button class="btn green" id="save-interview">Schedule and email applicant</button></div></div>
<div class="portal-modal" id="outcome-modal"><div class="card portal-modal-card" role="dialog" aria-modal="true"><div class="class-top"><h2>Record interview outcome</h2><button class="btn soft sm" onclick="closeOutcomeModal()">Close</button></div><div class="field"><label>Outcome</label><select id="interview-outcome"><option value="advance">Advance</option><option value="reschedule">Reschedule</option><option value="approve">Recommend approval</option><option value="reject">Recommend rejection</option></select></div><div class="field"><label>Private interview notes</label><textarea id="interview-notes" rows="5" maxlength="5000"></textarea></div><div class="row-actions"><button class="btn green" onclick="finishInterview('completed')">Save outcome</button><button class="btn danger" onclick="finishInterview('no_show')">Mark no-show</button></div><div class="msg" id="outcome-msg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=10"></script><script>
let applications=[],interviews=[],admins=[],activeApplication=null,activeInterview=null;
(async()=>{if(!await requireAuth())return;const me=await getProfile();if(!me)return;if(me.role!=="admin")return routeByRole(me.role);window._meId=me.id;document.getElementById("who").textContent=me.full_name+" ";await loadFacultyApplications()})();
async function loadFacultyApplications(){const[a,i,p]=await Promise.all([sb.from("teacher_applications").select("*").order("submitted_at",{ascending:false}),sb.from("faculty_interviews").select("*").order("scheduled_at",{ascending:false}),sb.from("profiles").select("id,full_name,role,is_active").eq("role","admin").eq("is_active",true).order("full_name")]);const box=document.getElementById("faculty-applications");if(a.error||i.error){box.innerHTML=`<p class="empty">Applications could not be loaded: ${esc(a.error?.message||i.error?.message)}</p>`;return}applications=a.data||[];interviews=i.data||[];admins=p.data||[];renderApplications()}
function latestInterview(applicationId){return interviews.find(x=>x.application_id===applicationId)}
function formatInterview(i){return new Date(i.scheduled_at).toLocaleString("en-PK",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Karachi"})}
function renderApplications(){const labels={submitted:"Awaiting review",under_review:"Under review",approved:"Approved",rejected:"Not approved"};mountList("faculty-applications","faculty-applications",applications,{placeholder:"Search applicants by name, email or subject…",noun:"applications",pageSize:10,empty:"No faculty applications yet.",match:(a,t)=>`${a.first_name||""} ${a.last_name||""} ${a.full_name} ${a.email} ${a.phone} ${(a.subjects||[]).join(" ")} ${a.status}`.toLowerCase().includes(t),render:items=>`<div class="people-table-wrap"><table class="people-table"><thead><tr><th>Applicant</th><th>Contact</th><th>Professional details</th><th>Application</th><th>Interview</th><th>Actions</th></tr></thead><tbody>${items.map(a=>{const i=latestInterview(a.id);return`<tr><td data-label="Applicant"><strong>${esc(a.first_name||a.full_name||"-")} ${esc(a.last_name||"")}</strong><br><span class="meta">${new Date(a.submitted_at).toLocaleString()}</span></td><td data-label="Contact"><span class="breakable">${esc(a.email)}</span><br>${esc(a.phone)}${a.city?` · ${esc(a.city)}`:""}</td><td data-label="Professional details">${esc((a.subjects||[]).join(", ")||"-")}<br><span class="meta">${esc(a.qualification||"Qualification not supplied")}${a.education_board?` · ${esc(a.education_board)}`:""}${a.experience_years!=null?` · ${esc(a.experience_years)} years`:""}</span>${a.message?`<details><summary>Professional summary</summary><p class="meta">${esc(a.message)}</p></details>`:""}</td><td data-label="Application"><span class="pill ${a.status==="approved"?"paid":a.status==="rejected"?"pending":""}">${esc(labels[a.status]||a.status)}</span></td><td data-label="Interview">${i?`<strong>${esc(formatInterview(i))}</strong><br><span class="pill ${i.status==="completed"?"paid":i.status==="cancelled"||i.status==="no_show"?"pending":""}">${esc(i.status.replaceAll("_"," "))}</span>${i.applicant_joined_at?'<br><span class="meta">Applicant joined</span>':""}`:'<span class="meta">Not scheduled</span>'}</td><td data-label="Actions" class="people-actions"><div class="row-actions">${!["approved","rejected"].includes(a.status)?`<button class="btn soft sm" onclick="openInterviewModal('${a.id}','${i?.id||""}')">${i?"Reschedule":"Schedule interview"}</button>`:""}${i&&["scheduled","live"].includes(i.status)?`<a class="btn green sm" href="faculty-interview.html?interview=${encodeURIComponent(i.id)}">Open Jitsi room</a><button class="btn soft sm" onclick="openOutcomeModal('${i.id}')">Outcome</button>`:""}${a.status==="submitted"?`<button class="btn soft sm" onclick="setStatus('${a.id}','under_review')">Start review</button>`:""}${!["approved","rejected"].includes(a.status)?`<button class="btn green sm" onclick="setStatus('${a.id}','approved')">Approve</button><button class="btn danger sm" onclick="setStatus('${a.id}','rejected')">Reject</button>`:""}</div></td></tr>`}).join("")}</tbody></table></div>`})}
function renderApplications(){const labels={submitted:"Awaiting interview",under_review:"Interview workflow",approved:"Approved",rejected:"Not approved"};mountList("faculty-applications","faculty-applications",applications,{placeholder:"Search applicants by name, email or subject…",noun:"applications",pageSize:8,empty:"No faculty applications yet.",match:(a,t)=>`${a.first_name||""} ${a.last_name||""} ${a.full_name} ${a.email} ${a.phone} ${(a.subjects||[]).join(" ")} ${a.status}`.toLowerCase().includes(t),render:items=>`<div class="faculty-application-grid">${items.map(a=>{const i=latestInterview(a.id),closed=["approved","rejected"].includes(a.status);return`<article class="faculty-application-card"><div class="faculty-card-head"><div><h3>${esc(a.first_name||a.full_name||"-")} ${esc(a.last_name||"")}</h3><p class="meta">Applied ${new Date(a.submitted_at).toLocaleString()}</p></div><span class="pill ${a.status==="approved"?"paid":a.status==="rejected"?"pending":""}">${esc(labels[a.status]||a.status)}</span></div><div class="faculty-card-body"><section><span class="faculty-label">Contact</span><strong class="breakable">${esc(a.email)}</strong><span>${esc(a.phone)}${a.city?` · ${esc(a.city)}`:""}</span></section><section><span class="faculty-label">Subjects</span><div class="directory-chips">${(a.subjects||[]).length?a.subjects.map(s=>`<span class="directory-chip soft">${esc(s)}</span>`).join(""):'<span class="meta">Not supplied</span>'}</div></section><section><span class="faculty-label">Professional background</span><strong>${esc(a.qualification||"Qualification not supplied")}</strong><span>${esc(a.education_board||"Board not supplied")}${a.experience_years!=null?` · ${esc(a.experience_years)} years`:""}</span>${a.message?`<details><summary>Professional summary</summary><p class="meta">${esc(a.message)}</p></details>`:""}</section><section><span class="faculty-label">Interview</span>${i?`<strong>${esc(formatInterview(i))}</strong><span><span class="pill ${i.status==="completed"?"paid":i.status==="cancelled"||i.status==="no_show"?"pending":""}">${esc(i.status.replaceAll("_"," "))}</span>${i.applicant_joined_at?' · Applicant joined':""}</span>`:'<span class="meta">Not scheduled</span>'}</section></div><div class="faculty-card-actions">${!closed?`<button class="btn green sm" onclick="openInterviewModal('${a.id}','${i?.id||""}')">${i?"Reschedule interview":"Schedule interview"}</button>`:""}${i&&["scheduled","live"].includes(i.status)?`<a class="btn soft sm" href="faculty-interview.html?interview=${encodeURIComponent(i.id)}">Open Jitsi room</a><button class="btn soft sm" onclick="openOutcomeModal('${i.id}')">Record outcome</button>`:""}${!closed?`<details class="action-menu"><summary>Decision</summary><div class="action-menu-panel"><button class="btn green sm" onclick="setStatus('${a.id}','approved')">Approve as teacher</button><button class="btn danger sm" onclick="setStatus('${a.id}','rejected')">Do not approve</button></div></details>`:""}</div></article>`}).join("")}</div>`})}
function localInputValue(iso){if(!iso)return"";return new Intl.DateTimeFormat("sv-SE",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Karachi"}).format(new Date(iso)).replace(" ","T")}
function openInterviewModal(applicationId,interviewId=""){activeApplication=applications.find(a=>a.id===applicationId);activeInterview=interviews.find(i=>i.id===interviewId)||null;document.getElementById("interview-applicant").textContent=activeApplication.full_name;document.getElementById("interview-time").value=localInputValue(activeInterview?.scheduled_at);document.getElementById("interview-duration").value=String(activeInterview?.duration_minutes||30);document.getElementById("interview-interviewer").innerHTML=admins.map(a=>`<option value="${a.id}" ${a.id===(activeInterview?.interviewer_id||window._meId)?"selected":""}>${esc(a.full_name)}</option>`).join("");document.getElementById("interview-msg").className="msg";document.getElementById("interview-msg").textContent="";document.getElementById("interview-modal").style.display="flex"}
function closeInterviewModal(){document.getElementById("interview-modal").style.display="none"}
function pakistanIso(local){return new Date(`${local}:00+05:00`).toISOString()}
document.getElementById("save-interview").onclick=async()=>{const message=document.getElementById("interview-msg"),time=document.getElementById("interview-time").value;if(!time){message.className="msg err";message.textContent="Choose the interview date and time.";return}message.className="msg";message.textContent="Scheduling and sending email…";const{data:{session}}=await sb.auth.getSession();const res=await fetch(`${SUPABASE_URL}/functions/v1/admin-faculty-interview`,{method:"POST",headers:{Authorization:`Bearer ${session.access_token}`,"Content-Type":"application/json"},body:JSON.stringify({action:"schedule",application_id:activeApplication.id,interview_id:activeInterview?.id||null,scheduled_at:pakistanIso(time),duration_minutes:Number(document.getElementById("interview-duration").value),interviewer_id:document.getElementById("interview-interviewer").value})});const body=await res.json().catch(()=>({}));if(!res.ok){message.className="msg err";message.textContent=body.error||"Interview could not be scheduled.";return}message.className="msg ok";message.textContent=body.email_sent?"Interview scheduled and applicant emailed.":"Interview scheduled, but the email could not be sent.";setTimeout(async()=>{closeInterviewModal();await loadFacultyApplications()},900)};
function openOutcomeModal(id){activeInterview=interviews.find(i=>i.id===id);document.getElementById("interview-outcome").value=activeInterview.outcome||"advance";document.getElementById("interview-notes").value=activeInterview.interview_notes||"";document.getElementById("outcome-msg").textContent="";document.getElementById("outcome-modal").style.display="flex"}
function closeOutcomeModal(){document.getElementById("outcome-modal").style.display="none"}
async function finishInterview(status){const{data:{session}}=await sb.auth.getSession();const res=await fetch(`${SUPABASE_URL}/functions/v1/admin-faculty-interview`,{method:"POST",headers:{Authorization:`Bearer ${session.access_token}`,"Content-Type":"application/json"},body:JSON.stringify({action:"finish",interview_id:activeInterview.id,status,outcome:document.getElementById("interview-outcome").value,interview_notes:document.getElementById("interview-notes").value})});const body=await res.json().catch(()=>({}));if(!res.ok){document.getElementById("outcome-msg").className="msg err";document.getElementById("outcome-msg").textContent=body.error||"Outcome could not be saved.";return}closeOutcomeModal();await loadFacultyApplications()}
async function setStatus(applicationId,status){const wording=status==="approved"?"approve this applicant and create their teacher account":status==="rejected"?"mark this application as not approved":"move this application to under review";if(!confirm(`Are you sure you want to ${wording}? A status email will be sent.`))return;let admin_note="";if(status==="rejected")admin_note=prompt("Optional note to include in the applicant's email:")||"";const{data:{session}}=await sb.auth.getSession();const response=await fetch(`${SUPABASE_URL}/functions/v1/admin-teacher-application`,{method:"POST",headers:{Authorization:`Bearer ${session.access_token}`,"Content-Type":"application/json"},body:JSON.stringify({application_id:applicationId,status,admin_note})});const body=await response.json().catch(()=>({}));if(!response.ok)return alert("Application was not updated: "+(body.error||"Unknown error"));alert(status==="approved"?"Teacher account created. The applicant was emailed a secure password setup link.":`Application marked ${status.replaceAll("_"," ")}. Status email ${body.email_sent?"sent":"could not be sent"}.`);await loadFacultyApplications()}
</script></body></html>
