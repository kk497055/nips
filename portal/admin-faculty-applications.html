<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>NIPS Portal — Faculty Applications</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="portal.css?v=17"></head>
<body><div class="topbar"><div class="brand"><img src="../assets/nips-logo-1.png" alt="NIPS"> NIPS Portal</div><div class="right"><span id="who"></span><span class="badge">Admin</span><button class="btn ghost sm" onclick="logout()">Logout</button></div></div>
<main class="wrap"><a href="admin.html?view=staff" class="meta">← Back to Staff &amp; Access</a><p class="eyebrow" style="margin-top:20px">Recruitment workflow</p><h1>Faculty Applications</h1><p class="sub">Review faculty applicants separately from active staff accounts. Applicants have no portal or teacher access until approved.</p><section class="section"><div id="faculty-applications"><p class="empty">Loading…</p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=10"></script><script>
(async()=>{if(!await requireAuth())return;const me=await getProfile();if(!me)return;if(me.role!=="admin")return routeByRole(me.role);document.getElementById("who").textContent=me.full_name+" ";await loadFacultyApplications()})();
async function loadFacultyApplications(){const{data,error}=await sb.from("teacher_applications").select("*").order("submitted_at",{ascending:false});const box=document.getElementById("faculty-applications");if(error){box.innerHTML=`<p class="empty">Applications could not be loaded: ${esc(error.message)}</p>`;return}const labels={submitted:"Awaiting review",under_review:"Under review",approved:"Approved",rejected:"Not approved"};mountList("faculty-applications","faculty-applications",data||[],{placeholder:"Search applicants by name, email or subject…",noun:"applications",pageSize:10,empty:"No faculty applications yet.",match:(a,t)=>`${a.full_name} ${a.email} ${a.phone} ${(a.subjects||[]).join(" ")} ${a.status}`.toLowerCase().includes(t),render:items=>`<div class="people-table-wrap"><table class="people-table"><thead><tr><th>Applicant</th><th>Contact</th><th>Professional details</th><th>Status</th><th>Actions</th></tr></thead><tbody>${items.map(a=>`<tr><td data-label="Applicant"><strong>${esc(a.full_name)}</strong><br><span class="meta">${new Date(a.submitted_at).toLocaleString()}</span></td><td data-label="Contact"><span class="breakable">${esc(a.email)}</span><br>${esc(a.phone)}${a.city?` · ${esc(a.city)}`:""}</td><td data-label="Professional details">${esc((a.subjects||[]).join(", ")||"—")}<br><span class="meta">${esc(a.qualification||"Qualification not supplied")}${a.education_board?` · ${esc(a.education_board)}`:""}${a.experience_years!=null?` · ${esc(a.experience_years)} years`:""}</span>${a.message?`<details><summary>Professional summary</summary><p class="meta">${esc(a.message)}</p></details>`:""}</td><td data-label="Status"><span class="pill ${a.status==="approved"?"paid":a.status==="rejected"?"pending":""}">${esc(labels[a.status]||a.status)}</span></td><td data-label="Actions" class="people-actions">${a.status==="submitted"?`<button class="btn soft sm" onclick="setStatus('${a.id}','under_review')">Start review</button>`:""}${!["approved","rejected"].includes(a.status)?`<button class="btn green sm" onclick="setStatus('${a.id}','approved')">Approve as teacher</button><button class="btn danger sm" onclick="setStatus('${a.id}','rejected')">Do not approve</button>`:""}</td></tr>`).join("")}</tbody></table></div>`})}
async function setStatus(applicationId,status){const wording=status==="approved"?"approve this applicant and create their teacher account":status==="rejected"?"mark this application as not approved":"move this application to under review";if(!confirm(`Are you sure you want to ${wording}? A status email will be sent.`))return;let admin_note="";if(status==="rejected")admin_note=prompt("Optional note to include in the applicant's email:")||"";const{data:{session}}=await sb.auth.getSession();const response=await fetch(`${SUPABASE_URL}/functions/v1/admin-teacher-application`,{method:"POST",headers:{Authorization:`Bearer ${session.access_token}`,"Content-Type":"application/json"},body:JSON.stringify({application_id:applicationId,status,admin_note})});const body=await response.json().catch(()=>({}));if(!response.ok)return alert("Application was not updated: "+(body.error||"Unknown error"));alert(status==="approved"?"Teacher account created. The applicant was emailed a secure password setup link.":`Application marked ${status.replaceAll("_"," ")}. Status email ${body.email_sent?"sent":"could not be sent"}.`);await loadFacultyApplications()}
</script></body></html>
