<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>NIPS Portal — Set a new password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="portal.css?v=14" />
  <meta name="theme-color" content="#1a5336" />
</head>
<body class="auth" data-portal-footer="false">
  <main class="auth-card">
    <section class="auth-brand">
      <div class="logo-row"><img src="../assets/nips-logo-1.png" alt="NIPS" onerror="this.style.display='none'"/><span class="name">NIPS<small>Education Solutions</small></span></div>
      <div class="kicker">Account security</div>
      <h2>Set a new password.</h2>
      <p class="lead">Choose a strong password that you do not use on another service.</p>
      <div class="brand-foot">Need help? Contact NIPS at +92 321 5554125.</div>
    </section>
    <section class="auth-form">
      <h1>Reset your password</h1>
      <p class="tag">Create a new password for your NIPS Portal account.</p>
      <div class="msg" id="msg"></div>
      <div id="reset-form" hidden>
        <div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" /></div>
        <div class="field"><label for="password2">Confirm new password</label><input id="password2" type="password" autocomplete="new-password" minlength="6" placeholder="Repeat your new password" /></div>
        <button class="btn" id="submit" type="button">Save new password</button>
      </div>
      <p class="fine"><a href="login.html">Back to sign in</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=9"></script>
  <script>
    const msg = document.getElementById("msg");
    const form = document.getElementById("reset-form");
    const show = (text, ok = false) => { msg.className = "msg " + (ok ? "ok" : "err"); msg.textContent = text; };
    const showForm = () => { form.hidden = false; msg.className = "msg"; };

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) showForm();
      else show("This password-reset link is invalid or has expired. Request a new link from NIPS staff.");
    })();

    sb.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) showForm();
    });

    document.getElementById("submit").onclick = async () => {
      const password = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;
      if (password.length < 6) return show("Password must be at least 6 characters.");
      if (password !== password2) return show("Passwords do not match.");
      const button = document.getElementById("submit");
      button.disabled = true; button.textContent = "Saving…";
      const { error } = await sb.auth.updateUser({ password });
      button.disabled = false; button.textContent = "Save new password";
      if (error) return show(error.message);
      form.hidden = true;
      show("Your password has been updated. You can now sign in with your new password.", true);
    };
  </script>
</body>
</html>
